# ArchiKen 宝塔面板 — Nginx 反向代理配置
#
# 使用方法：
# 1. 宝塔面板 → 网站 → 添加站点 → 填入域名 → PHP 版本选「纯静态」
# 2. 证书 → 申请 Let's Encrypt 或上传阿里云免费证书
# 3. 设置 → 配置文件 → 把下面的反代 location 块粘贴到 server { } 内部（替换宝塔默认的 location /）
# 4. 保存后 Nginx 自动 reload
# 5. 前端构建产物 dist/ 上传到站点根目录（宝塔默认 /www/wwwroot/你的域名/dist/）
#
# 后端容器端口映射：
#   archiken-kernel:  127.0.0.1:4319（Python 内核）
#   archiken-server:  127.0.0.1:4318（Node 业务）
# 只有宝塔 Nginx 能反代到这两个端口，公网无法直接访问

# ============================================================
# 以下内容粘贴到宝塔站点 server { } 内部
# ============================================================

    # --- 上传大小放宽（IFC 文件可能很大） ---
    client_max_body_size 512m;
    client_body_timeout 600s;
    send_timeout 300s;

    # --- 速率限制（防刷） ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # --- 安全头 ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ============= API 反代：Python 内核（L2） =============
    location /api/kernel/ {
        limit_req zone=api burst=100 nodelay;
        limit_conn conn 20;

        proxy_pass http://127.0.0.1:4319/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ============= API 反代：Node 业务（L3） =============
    location /api/server/ {
        limit_req zone=api burst=100 nodelay;
        limit_conn conn 20;

        # 上传接口单独限速（5MB/min）
        location /api/server/upload {
            limit_req zone=upload burst=3 nodelay;
            proxy_pass http://127.0.0.1:4318/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        proxy_pass http://127.0.0.1:4318/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ============= 健康检查探针 =============
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:4319/health;
    }

    # ============= 前端静态资源（SPA 回退） =============
    # 宝塔默认 root 通常是 /www/wwwroot/你的域名
    # 把 dist/ 内容放到该目录下
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源强缓存（hash 命名，安全长缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
